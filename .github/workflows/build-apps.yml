name: Build Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (windows, macos, linux, android, all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - macos
          - linux
          - android

env:
  NODE_VERSION: 22
  RUST_VERSION: 1.77.2

jobs:
  typecheck:
    name: Typecheck Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build-gui-web:
    name: Build GUI (Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - working-directory: gui
        run: npm install
      - working-directory: gui
        run: npm run build

  build-native:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows EXE
            platform: windows
            os: windows-latest
            rust-targets: ''
            artifact: adapter-os-windows
            path: gui/src-tauri/target/release/bundle/nsis/*.exe
            system-deps: ''
          - name: macOS DMG
            platform: macos
            os: macos-latest
            rust-targets: aarch64-apple-darwin
            artifact: adapter-os-macos
            path: gui/src-tauri/target/release/bundle/dmg/*.dmg
            system-deps: ''
          - name: Linux AppImage
            platform: linux
            os: ubuntu-latest
            rust-targets: ''
            artifact: adapter-os-linux
            path: |
              gui/src-tauri/target/release/bundle/appimage/*.AppImage
              gui/src-tauri/target/release/bundle/deb/*.deb
            system-deps: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget libssl-dev
          - name: Android APK
            platform: android
            os: ubuntu-latest
            rust-targets: aarch64-linux-android
            artifact: adapter-os-android
            path: gui/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            system-deps: ''
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.platform == 'all' || inputs.platform == matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Add Rust cross-compile targets
        if: matrix.rust-targets != ''
        run: rustup target add ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri

      - name: Install Linux system deps
        if: matrix.system-deps != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.system-deps }}

      - name: Setup Java 17
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3

      - name: Install frontend deps
        working-directory: gui
        run: npm install

      - name: Init Android project
        if: matrix.platform == 'android'
        working-directory: gui
        run: npm run tauri android init

      - name: Build Android APK
        if: matrix.platform == 'android'
        working-directory: gui
        run: npm run tauri android build

      - name: Build desktop bundle
        if: matrix.platform != 'android'
        working-directory: gui
        run: npm run tauri build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [build-native]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          draft: false
          generate_release_notes: true
