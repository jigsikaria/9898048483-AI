[package]
name = "adapter-os"
version = "10.0.0"
description = "Universal AI Gateway & Cross-Platform Adapter"
authors = ["AdapterOS"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "adapter_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
