# Cloudflare Workers deployment for AdapterOS Universal AI Gateway
# Deploy: wrangler deploy --var ANTHROPIC_API_KEY:xxxx
name = "adapter-os"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

[observability]
enabled = true

# --- Provider keys (set via `wrangler secret put <NAME>` for production) ---
# Secrets: ANTHROPIC_API_KEY, GEMINI_API_KEY, OPENAI_API_KEY, DEEPSEEK_API_KEY,
#          GROQ_API_KEY, OPENROUTER_API_KEY, MISTRAL_API_KEY, COHERE_API_KEY

[vars]
PORT = "8787"
HOST = "0.0.0.0"
GATEWAY_API_KEY = "change-me"
REQUIRE_GATEWAY_KEY = "true"
RATE_LIMIT_ENABLED = "true"
RATE_LIMIT_WINDOW_MS = "60000"
RATE_LIMIT_MAX = "60"
OLLAMA_BASE_URL = "http://localhost:11434"
LOG_LEVEL = "info"

# Optional: pin models per environment
# [env.staging.vars]
# FALLBACK_CHAIN = "anthropic,gemini,openrouter"

[env.production]
workers_dev = false

[env.production.routes]
pattern = "api.yourdomain.com"
custom_domain = true

# CORS is configured inside the Hono app; restrict origins in production.
# [env.production.vars]
# ALLOWED_ORIGINS = "https://app.yourdomain.com"
