services:
  - type: web
    name: adapter-os
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:node
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 22.22.0
      - key: REQUIRE_GATEWAY_KEY
        value: "true"
      - key: GATEWAY_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
